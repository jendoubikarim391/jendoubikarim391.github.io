<style>
/* Layout: chat on the left as the guest sees it, host view on the right as the owner sees it. Stacks on phones. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #14201f;
  --muted: #55696a;
  --line: #d3dedc;
  --teal: #0e5f5c;
  --teal-soft: #dcebe9;
  --on-teal: #ffffff;
  --sulfur: #e9c441;
  --on-sulfur: #3b3000;
  --bot: #e6efed;
  --good: #1f7a4d;
  --warn: #a85a12;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1716;
    --surface: #152221;
    --ink: #e4efed;
    --muted: #93aaa7;
    --line: #284240;
    --teal: #58bdb6;
    --teal-soft: #1b3836;
    --on-teal: #06211f;
    --bot: #1c2f2d;
    --good: #5fc596;
    --warn: #e8a35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1716;
  --surface: #152221;
  --ink: #e4efed;
  --muted: #93aaa7;
  --line: #284240;
  --teal: #58bdb6;
  --teal-soft: #1b3836;
  --on-teal: #06211f;
  --bot: #1c2f2d;
  --good: #5fc596;
  --warn: #e8a35e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.pill { background: var(--sulfur); color: var(--on-sulfur); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; gap: 2px; }
.langs button { font: inherit; font-weight: 600; font-size: 0.85rem; min-width: 48px; min-height: 40px; border: 0; background: transparent; color: var(--muted); border-radius: 7px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }
.intro { margin: 0; color: var(--muted); max-width: 68ch; }

.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0; }
.panel-head p { margin: 0; color: var(--muted); font-size: 0.85rem; }

.chat-log { height: 430px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
@media (max-width: 860px) { .chat-log { height: 380px; } }
.msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; overflow-wrap: anywhere; }
.msg.bot { background: var(--bot); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--teal); color: var(--on-teal); border-bottom-right-radius: 4px; align-self: flex-end; }
.msg.form { width: 100%; max-width: 100%; }
.form-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
@media (max-width: 460px) { .form-fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
.field input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }
.btn { font: inherit; font-weight: 600; border: 0; background: var(--teal); color: var(--on-teal); border-radius: 9px; padding: 0 16px; min-height: 42px; cursor: pointer; }
.err { color: var(--warn); font-size: 0.82rem; margin: 6px 0 0; }
.ok { color: var(--good); font-weight: 600; margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
.chips-label { padding: 0 18px 6px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.chip { font: inherit; font-size: 0.85rem; background: var(--teal-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 0 13px; min-height: 40px; cursor: pointer; }
.composer { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; min-height: 42px; }

:focus-visible { outline: 3px solid var(--sulfur); outline-offset: 2px; }
input:focus-visible { outline-offset: 0; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.stat.warn b { color: var(--warn); }
@media (max-width: 460px) { .stat { padding: 12px 10px; } .stat b { font-size: 1.5rem; } }
.block { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.block:last-child { border-bottom: 0; }
.block h3 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; }
.empty { color: var(--muted); font-size: 0.88rem; margin: 0; }
.topic { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 0.9rem; }
.topic i { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--teal); display: block; }
.topic span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.req, .unq { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 0.88rem; overflow-wrap: anywhere; }
.req { border-left: 4px solid var(--sulfur); }
.unq { border-left: 4px solid var(--warn); }
.note { margin: 0; font-size: 0.82rem; color: var(--muted); max-width: 80ch; }

@media (prefers-reduced-motion: reduce) { .chat-log { scroll-behavior: auto; } }
</style>

</div>

    $('t-sa').textContent = u.sa;
    $('t-sp').textContent = u.sp;
    $('t-topics').textContent = u.topics;
    $('t-requests').textContent = u.requests;
    $('t-unanswered').textContent = u.unanswered;
    $('t-note').textContent = u.note;

    var lg = $('langs');
    lg.innerHTML = '';
    ['it', 'en', 'uk', 'ru', 'de', 'fr'].forEach(function (code) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = code === 'uk' ? 'УК' : code === 'ru' ? 'РУ' : code.toUpperCase();
      b.setAttribute('aria-pressed', String(code === state.lang));
      b.addEventListener('click', function () { state.lang = code; renderAll(); });
      lg.appendChild(b);
    });

    var ch = $('chips');
    ch.innerHTML = '';
    u.chips.forEach(function (label) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = label;
      b.addEventListener('click', function () { ask(label); });
      ch.appendChild(b);
    });
  }

  function formHtml(n) {
    var u = UI[state.lang], f = state.forms[n];
    if (f.done) { return '<p class="ok">' + esc(u.done) + '</p>'; }
    var today = new Date().toISOString().slice(0, 10);
    return '<div>' + esc(u.formIntro) + '</div>' +
      '<form data-form="' + n + '" novalidate>' +
      '<div class="form-fields">' +
      '<label class="field" for="f' + n + '-name">' + esc(u.name) + '<input id="f' + n + '-name" data-k="name" type="text" value="' + esc(f.name) + '"></label>' +
      '<label class="field" for="f' + n + '-guests">' + esc(u.guests) + '<input id="f' + n + '-guests" data-k="guests" type="number" min="1" max="12" value="' + esc(f.guests) + '"></label>' +
      '<label class="field" for="f' + n + '-arrive">' + esc(u.arrive) + '<input id="f' + n + '-arrive" data-k="arrive" type="date" min="' + today + '" value="' + esc(f.arrive) + '"></label>' +
      '<label class="field" for="f' + n + '-depart">' + esc(u.depart) + '<input id="f' + n + '-depart" data-k="depart" type="date" min="' + today + '" value="' + esc(f.depart) + '"></label>' +
      '</div>' +
      (f.error ? '<p class="err">' + esc(UI[state.lang][f.error]) + '</p>' : '') +
      '<p style="margin:10px 0 0"><button class="btn" type="submit">' + esc(u.submit) + '</button></p>' +
      '</form>';
  }

  function renderChat() {
    var u = UI[state.lang], log = $('log'), html = '';
    state.messages.forEach(function (m) {
      if (m.type === 'user') html += '<div class="msg user">' + esc(m.text) + '</div>';
      else if (m.type === 'greeting') html += '<div class="msg bot">' + esc(u.greeting) + '</div>';
      else if (m.type === 'fallback') html += '<div class="msg bot">' + esc(u.fallback) + '</div>';
      else if (m.type === 'faq') {
        var item = FAQ.filter(function (x) { return x.id === m.id; })[0];
        html += '<div class="msg bot">' + esc(item.a[state.lang]) + '</div>';
      } else if (m.type === 'form') {
        html += '<div class="msg bot form">' + formHtml(m.n) + '</div>';
      }
    });
    log.innerHTML = html;
    log.scrollTop = log.scrollHeight;
  }

  function renderHost() {
    var u = UI[state.lang];
    $('s-q').textContent = state.asked;
    $('s-a').textContent = state.auto;
    $('s-p').textContent = state.passed;

    var ids = Object.keys(state.topicCounts).sort(function (a, b) { return state.topicCounts[b] - state.topicCounts[a]; });
    var max = ids.length ? state.topicCounts[ids[0]] : 1;
    $('topics').innerHTML = ids.length ? ids.map(function (id) {
      var item = FAQ.filter(function (x) { return x.id === id; })[0];
      return '<div class="topic"><span>' + esc(item.topic[state.lang]) + '</span><span>' + state.topicCounts[id] +
        '</span><i style="width:' + Math.max(6, Math.round(state.topicCounts[id] / max * 100)) + '%"></i></div>';
    }).join('') : '<p class="empty">' + esc(u.noTopics) + '</p>';

    $('requests').innerHTML = state.requests.length ? state.requests.map(function (r) {
      return '<div class="req">' + esc(u.reqFmt(r, fmtDate)) + '</div>';
    }).join('') : '<p class="empty">' + esc(u.noRequests) + '</p>';

    $('unanswered').innerHTML = state.unanswered.length ? state.unanswered.map(function (t) {
      return '<div class="unq">' + esc(t) + '</div>';
    }).join('') : '<p class="empty">' + esc(u.noUnanswered) + '</p>';
  }

  function renderAll() { renderStatic(); renderChat(); renderHost(); }

  function ask(text) {
    text = String(text).trim();
    if (!text) return;
    if (/[Ѐ-ӿ]/.test(text)) {
      var want = /[іїєґІЇЄҐ]/.test(text) ? 'uk' : /[ыэъёЫЭЪЁ]/.test(text) ? 'ru' : (state.lang === 'uk' || state.lang === 'ru') ? state.lang : 'uk';
      if (want !== state.lang) { state.lang = want; renderStatic(); }
    }
    state.messages.push({ type: 'user', text: text });
    state.asked += 1;
    var item = match(text);
    if (!item) {
      state.passed += 1;
      state.unanswered.push(text);
      state.messages.push({ type: 'fallback' });
    } else {
      state.auto += 1;
      state.topicCounts[item.id] = (state.topicCounts[item.id] || 0) + 1;
      if (item.form) {
        state.formCount += 1;
        state.forms[state.formCount] = { name: '', guests: '2', arrive: '', depart: '', error: '', done: false };
        state.messages.push({ type: 'form', n: state.formCount });
      } else {
        state.messages.push({ type: 'faq', id: item.id });
      }
    }
    renderChat();
    renderHost();
  }

  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q');
    var v = q.value;
    q.value = '';
    ask(v);
  });

  var log = $('log');
  log.addEventListener('input', function (e) {
    var t = e.target, form = t.closest ? t.closest('form[data-form]') : null;
    if (!form || !t.getAttribute('data-k')) return;
    state.forms[form.getAttribute('data-form')][t.getAttribute('data-k')] = t.value;
  });
  log.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form.getAttribute || !form.getAttribute('data-form')) return;
    e.preventDefault();
    var n = form.getAttribute('data-form'), f = state.forms[n];
    if (!f.name.trim() || !f.guests || !f.arrive || !f.depart) { f.error = 'errFill'; renderChat(); return; }
    if (f.depart <= f.arrive) { f.error = 'errDates'; renderChat(); return; }
    f.error = '';
    f.done = true;
    state.requests.push({ name: f.name.trim(), guests: f.guests, arrive: f.arrive, depart: f.depart });
    renderChat();
    renderHost();
  });

  state.messages.push({ type: 'greeting' });
  renderStatic();
  ask(UI[state.lang].chips[0]);
})();
</script>
